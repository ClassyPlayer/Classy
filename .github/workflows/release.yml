name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. 20261102 or v1.6.0; leave blank for date-based tag)"
        required: false
        default: ""
        type: string
      channel:
        description: "Update channel: beta is a pre-release for players on the Beta channel, stable becomes Latest. A tag given above must match it (-beta or -beta.N is beta)."
        required: false
        default: beta
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test Release Version Script
        run: bash scripts/test_release_version.sh

      - name: Determine Version and Release Tag
        id: version
        # Tag values only through the environment: in the script text, a crafted tag name could run shell commands
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          OUTPUTS=$(bash scripts/release_version.sh)
          echo "$OUTPUTS"
          echo "$OUTPUTS" >> "$GITHUB_OUTPUT"

      - name: Check Translation Consistency
        run: python3 scripts/check_translations.py --strict

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.CLASSY_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CLASSY_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CLASSY_RELEASE_KEY_ALIAS }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          # One fixed key for all releases: Android installs an update over the app only with the same key.
          # Without the secrets (forks), Gradle signs with the runner's new debug key, as before.
          SIGNING=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            SIGNING=(
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks"
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS"
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
            )
          else
            echo "::warning::No release key in the secrets: the APK is signed with a new debug key"
          fi
          ./gradlew assembleRelease -PappVersionCode="$VERSION_CODE" -PappVersionName="$VERSION_NAME" "${SIGNING[@]}"

      - name: Package APK and Generate Update Metadata
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"

          # Writes one update manifest for the APK $1 to the file $2.
          # The APK URL names the tag: beta releases are never "latest", and old manifests keep pointing at their own APK.
          write_manifest() {
            cat << EOF > "$2"
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "releaseName": "Classy $RELEASE_NAME",
            "channel": "$CHANNEL",
            "apkName": "$1",
            "apkUrl": "https://github.com/$REPOSITORY/releases/download/$TAG_NAME/$1",
            "outputFile": "$1"
          }
          EOF
            echo "Generated $2:"
            cat "$2"
          }

          write_manifest "$APK_NAME" dist/update.json

      - name: Upload APK and Update Metadata
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: |
            dist/Classy-*.apk
            dist/update.json
          retention-days: 14

  build-roms:
    name: Build ${{ matrix.name }} ROM
    needs: build-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: y2
            name: "Y2"
            filename: rom_y2.zip
            artifact: rom-y2
          - type: a
            name: "Y1 Type A"
            filename: rom_y1_type_a.zip
            artifact: rom-y1-type-a
          - type: b
            name: "Y1 Type B"
            filename: rom_y1_type_b.zip
            artifact: rom-y1-type-b
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip e2fsprogs curl

      - name: Download Launcher APK
        uses: actions/download-artifact@v4
        with:
          name: launcher-apk
          path: apk_dir

      - name: Build ${{ matrix.name }} ROM
        run: |
          chmod +x scripts/build-rom.sh
          APK_PATH=$(find apk_dir -name '*.apk' | head -1)
          echo "Using launcher APK: $APK_PATH"
          mkdir -p dist
          ./scripts/build-rom.sh ${{ matrix.type }} --launcher-apk "$APK_PATH" "dist/${{ matrix.filename }}"

      - name: Upload ${{ matrix.name }} ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.filename }}
          retention-days: 14

  release:
    name: Publish Release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    needs: [build-apk, build-roms]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          # Only the release files: the unit-test-report artifact would add a stray index.html
          pattern: "{launcher-apk,rom-*}"
          merge-multiple: true

      - name: Prepare release files and checksums
        run: |
          cd release_assets
          sha256sum *.zip *.apk > SHA256SUMS.txt
          echo "Release assets prepared:"
          ls -lh

      - name: Prepare Release Notes
        env:
          CHANNEL: ${{ needs.build-apk.outputs.channel }}
        run: |
          : > release_body.md
          if [ "$CHANNEL" = "beta" ]; then
            cat << 'EOF' >> release_body.md
          > [!WARNING]
          > **This is a beta.** It may have bugs that are not in the stable release. Players get it in **Settings → General → System Update → Update Channel → Beta**.

          EOF
          fi
          cat << 'EOF' >> release_body.md
          ### Classy Release

          Automated build with full support for **Innioasis Y1** (Type A & Type B) and **Innioasis Y2**.

          #### 📦 Release Assets

          | File | Target Device | Notes |
          | :--- | :--- | :--- |
          | **`${{ needs.build-apk.outputs.apk_name }}`** | All Devices (Y1 / Y2) | Standalone launcher APK (sideload or install) |
          | **`update.json`** | All Devices | OTA update metadata for in-app updater |
          | **`rom_y2.zip`** | **Innioasis Y2** (MT6582) | Complete flashable ROM with dual-storage, watchdog & clickwheel keylayout |
          | **`rom_y1_type_a.zip`** | **Innioasis Y1** (Type A) | Flashable ROM for Y1 players with original firmware **2.0.0 or higher** |
          | **`rom_y1_type_b.zip`** | **Innioasis Y1** (Type B) | Flashable ROM for Y1 players with original firmware **below 2.0.0** |
          | **`SHA256SUMS.txt`** | All Files | SHA-256 integrity checksums |

          #### ⚡ Flashing Instructions (SP Flash Tool)
          1. Extract the corresponding zip file for your device.
          2. Launch `flash_tool.exe` (or Linux `flash_tool`).
          3. Load the scatter file (`MT6582_Android_scatter.txt` for Y2, `MT6572_Android_scatter.txt` for Y1).
          4. Select **Firmware Upgrade** or **Download Only**.
          5. Power off the device completely, click **Download**, and connect the USB cable.

          ---
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-apk.outputs.tag_name }}
          name: Classy ${{ needs.build-apk.outputs.release_name }}
          body_path: release_body.md
          files: release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.build-apk.outputs.channel == 'beta' }}
          # Only stable releases become Latest: players on Stable read releases/latest/download/update.json
          make_latest: ${{ needs.build-apk.outputs.channel == 'stable' && 'true' || 'false' }}
          # The tag must point at the commit that was built, so a beta can be promoted by building again from its tag
          target_commitish: ${{ github.sha }}
          overwrite_files: true
